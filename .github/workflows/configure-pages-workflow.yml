name: Configure Pages for Actions deployments

on:
  push:
    branches: [chore/configure-pages-workflow]
    paths:
      - .github/workflows/configure-pages-workflow.yml

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Select GitHub Actions as the Pages build source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow
      - name: Confirm Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '{status, build_type, source, html_url}'
